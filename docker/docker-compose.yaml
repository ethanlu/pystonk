services:
  pystonk:
    image: pystonk:latest
    container_name: pystonk
    stdin_open: true
    tty: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    entrypoint:
      - /bin/bash
      - docker/entrypoint.sh
    ports:
      - "3000:3000"
    volumes:
      - ../setup.py:/opt/app/setup.py
      - ../pystonk:/opt/app/pystonk
      - ../tests:/opt/app/tests
  nginx:
    image: nginx:latest
    container_name: reverse-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../pystonk/images/:/var/www/html:ro
    restart: unless-stopped
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    env_file:
      - .env
    command: [ "http", "host.docker.internal:8080", "--url=https://${NGROK_DOMAIN}" ]
    restart: unless-stopped