events {
    worker_connections 1024;
}

http {
    # Includes standard file types so browsers know how to render JPG/PNG instead of downloading them
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;
        root /var/www/html;

        # for pystonk generated images
        location /pystonk-images/ {
            alias /var/www/html/;

            # Optional optimizations for static file serving
            expires 1d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # for pystonk commands
        location / {
            proxy_pass http://pystonk:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}